<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel OSA</title>
  <link rel="stylesheet" href="css/base.css?v=5ee428c">
  <link rel="stylesheet" href="css/shell.css?v=5ee428c">
  <link rel="stylesheet" href="css/pulpit.css?v=5ee428c">
  <link rel="stylesheet" href="css/przesylki.css?v=5ee428c">
  <link rel="stylesheet" href="css/zasob.css?v=5ee428c">
  <link rel="stylesheet" href="css/klienci.css?v=5ee428c">
  <link rel="stylesheet" href="css/produkt.css?v=5ee428c">
  <link rel="stylesheet" href="css/raporty.css?v=5ee428c"><link rel="stylesheet" href="css/masowe.css?v=5ee428c">
  <link rel="stylesheet" href="css/feedback.css?v=5ee428c">
  <link rel="stylesheet" href="css/palette.css?v=5ee428c">
  <link rel="stylesheet" href="css/embed.css?v=5ee428c">
  <link rel="stylesheet" href="css/mobile.css?v=5ee428c">
  <!-- config.js generuje scripts/deploy-panel.ps1: window.OSA_CONFIG = { backendUrl, clientId, version, backends? } -->
  <script src="config.js?v=5ee428c"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    // Motyw i zwinięte menu ustawiane przed pierwszym malowaniem
    try { var t = JSON.parse(localStorage.getItem('otk-theme') || 'null'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    try { if (JSON.parse(localStorage.getItem('osa-sb-collapsed') || 'false')) document.documentElement.classList.add('sb-collapsed'); } catch (e) {}
  </script>
  <script type="module" src="js/main.js?v=5ee428c"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button type="button" class="tb-btn navtoggle" id="navToggle" aria-expanded="false" aria-controls="sidebar" title="Pokaż lub ukryj menu panelu"><span class="sr-only">Menu</span><span aria-hidden="true">☰</span></button>
    <a class="brand" href="#/pulpit" title="Panel OSA — strona startowa"><span class="brand-mark" aria-hidden="true">OSA</span><span class="brand-name">Panel</span></a>
    <button type="button" class="tb-btn tb-searchbtn" id="tbSearch" hidden aria-haspopup="dialog" title="Szukaj ekranów, zamówień, klientów i produktów (Ctrl+K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><span class="sr-only">Szukaj</span></button>
    <div class="tb-right">
      <a class="tb-btn tb-selly" id="tbSelly" href="#" target="_blank" rel="noopener" title="Otwiera tę samą stronę w panelu Selly (nowa karta)" hidden>Selly ↗</a>
      <button type="button" class="tb-btn" id="tbFeedback" hidden title="Zgłoś błąd, pomysł albo pytanie do administratora panelu"><span aria-hidden="true">✉</span><span class="tb-fb-text">Zgłoś</span></button>
      <div class="tb-user" id="tbUser" hidden>
        <button type="button" class="tb-btn" id="userBtn" aria-haspopup="true" aria-expanded="false" title="Konto, motyw, wylogowanie"><span class="avatar" id="avatar" aria-hidden="true">?</span><span class="caret" aria-hidden="true">▾</span></button>
        <div class="tb-menu" id="userMenu" hidden>
          <div class="small" id="who"></div>
          <div class="tb-menu-label small muted">Motyw</div>
          <div class="seg" role="group" aria-label="Motyw kolorystyczny" id="themeSw">
            <button type="button" data-theme-opt="system" aria-pressed="true" title="Jak w ustawieniach systemu">System</button>
            <button type="button" data-theme-opt="light" aria-pressed="false">Jasny</button>
            <button type="button" data-theme-opt="dark" aria-pressed="false">Ciemny</button>
          </div>
          <button type="button" class="secondary small" id="signOut" hidden title="Wyloguj z panelu na tym urządzeniu (konto Google pozostaje zalogowane)">Wyloguj</button>
        </div>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Menu panelu">
    <nav class="modnav" id="modNav" aria-label="Sekcje panelu"></nav>
    <button type="button" class="sb-collapse" id="sbCollapse" title="Zwiń lub rozwiń menu boczne (zostaną same ikony)" aria-pressed="false"><span aria-hidden="true">‹</span><span class="sr-only">Zwiń menu</span></button>
  </aside>

  <main class="content">
    <div class="page-head" id="pageHead" hidden>
      <div class="crumbs small" id="modSub"></div>
      <h1 id="pageTitle"></h1>
    </div>
    <div id="pageErrors"></div>
    <div id="modules"></div>

    <div class="card" id="cardStart"><div class="loading"><div class="line"><span class="spinner"></span>Otwieram panel…</div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
    <div class="card" id="cardSignIn" hidden>
      <div class="signin">
        <div><strong>Zaloguj się kontem Google</strong></div>
        <div class="muted small" id="signInMsg">Panel jest dostępny dla osób z listy uprawnionych.</div>
        <div id="signInBtn"></div>
      </div>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <footer class="app-foot muted small"><span id="appFoot"></span><span id="beSep" hidden> · </span><span id="beInfo" hidden></span> · <a href="privacy.html">Prywatność</a></footer>
  </main>
</div>
</body>
</html>
