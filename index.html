<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel OSA</title>
  <link rel="stylesheet" href="css/base.css">
  <!-- config.js generuje scripts/deploy-panel.ps1: window.OSA_CONFIG = { backendUrl, clientId, version, backends? } -->
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    // Motyw ustawiany przed pierwszym malowaniem: system (domyślnie) / jasny / ciemny
    try { var t = JSON.parse(localStorage.getItem('otk-theme') || 'null'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<main>
  <header class="app-head">
    <div>
      <h1>Panel OSA <span class="sub" id="modSub"></span></h1>
      <span class="muted small who"><span id="who"></span> <button type="button" class="linkbtn small" id="signOut" hidden title="Wyloguj z panelu na tym urządzeniu (konto Google pozostaje zalogowane)">Wyloguj</button></span>
    </div>
    <div class="head-tools">
      <div class="seg" role="group" aria-label="Motyw kolorystyczny" id="themeSw">
        <button type="button" data-theme-opt="system" aria-pressed="true">System</button>
        <button type="button" data-theme-opt="light" aria-pressed="false">Jasny</button>
        <button type="button" data-theme-opt="dark" aria-pressed="false">Ciemny</button>
      </div>
    </div>
  </header>
  <div class="modbar">
    <button type="button" class="secondary navtoggle" id="navToggle" aria-expanded="false" aria-controls="modNav" title="Pokaż lub ukryj listę modułów panelu">☰ Menu</button>
    <nav class="modnav" id="modNav" aria-label="Moduły panelu"></nav>
  </div>
  <div id="pageErrors"></div>

  <div id="modules"></div>

  <div class="card" id="cardStart"><div class="loading"><div class="line"><span class="spinner"></span>Otwieram raport…</div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
  <div class="card" id="cardSignIn" hidden>
    <div class="signin">
      <div><strong>Zaloguj się kontem Google</strong></div>
      <div class="muted small" id="signInMsg">Panel jest dostępny dla osób z listy uprawnionych.</div>
      <div id="signInBtn"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <footer class="app-foot muted small"><span id="appFoot"></span><span id="beSep" hidden> · </span><span id="beInfo" hidden></span> · <a href="privacy.html">Prywatność</a></footer>
</main>
</body>
</html>
